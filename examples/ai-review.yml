# Copy to .github/workflows/ai-review.yml in any TanksterAI repository.
#
# Reviews a pull request when it is opened, reopened or marked ready, and
# again whenever the `ai-review` label is added. Run it by hand (Actions ->
# ai-review -> Run workflow) to review any open pull request by number.
# Free and secretless: see TanksterAI/ai-review's README.
name: ai-review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      force:
        description: Review again even if this commit was already reviewed
        type: boolean
        default: false

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions: {}

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action != 'labeled' && !github.event.pull_request.draft) ||
      github.event.label.name == 'ai-review'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: TanksterAI/ai-review/.github/workflows/review.yml@v1
    with:
      pr-number: ${{ inputs.pr || 0 }}
      force: ${{ inputs.force || github.event.action == 'labeled' }}
