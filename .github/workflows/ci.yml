# Unit tests: the Worker (OIDC verification, budget, prompt and review
# building) and the reusable workflow's script, run as written. No
# dependencies to install, and no Node to download.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    # This repository is public: GitHub-hosted runners are free and unlimited
    # here, and the org's own runners refuse public repositories.
    runs-on: ubuntu-latest # hosted-only: public repository
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tests run on the Node 24 the runner ships for JavaScript actions
      # (github-script's process.execPath), so no toolchain is installed.
      - name: Test
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.info(`Node ${process.version}`);
            // One test file at a time: the CPU-bound checks (10 ms on Workers
            // Free) time themselves, and test files running side by side on
            // a two-CPU runner slowed them past their bounds.
            await exec.exec(process.execPath, ["--test", "--test-concurrency=1", "worker/test/*.test.js"]);
