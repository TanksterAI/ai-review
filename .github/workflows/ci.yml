# Unit tests: the Worker (OIDC verification, budget, prompt and review
# building) and the reusable workflow's script, run as written. No
# dependencies to install.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    # Light lane, run-bound so a light runner only ever takes a job of this
    # run: see "Light lane" in TanksterAI/.github's README. No Docker, no
    # toolchain, no install.
    runs-on: >-
      ${{ (vars.CI_LIGHT_RUNNER == 'tankster-light'
      && format('tankster-light-{0}-{1}', github.run_id, github.run_attempt))
      || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm test
