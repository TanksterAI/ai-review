# Reviews this repository's own pull requests, by hand: Actions -> ai-review ->
# Run workflow, on main, with the PR number. Dispatch only: a pull_request run
# here would call review.yml at refs/pull/N/merge, which the Worker refuses
# (it trusts review.yml at main and v1 only).
name: ai-review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
      force:
        description: Review again even if this commit was already reviewed
        type: boolean
        default: false

concurrency:
  group: ai-review-${{ inputs.pr }}
  cancel-in-progress: false

permissions: {}

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: ./.github/workflows/review.yml
    # A dispatched number input arrives as a string ('2'), which review.yml's
    # typed number input refuses at startup; fromJSON converts it. force goes
    # through fromJSON too, which accepts a boolean or the string
    # 'true'/'false' (an API dispatch may send either).
    with:
      # This repository is public: GitHub-hosted runners are free here, and
      # the org's own runners refuse public repositories.
      runs-on: ubuntu-latest
      pr-number: ${{ fromJSON(inputs.pr || '0') }}
      force: ${{ fromJSON(inputs.force || 'false') }}
